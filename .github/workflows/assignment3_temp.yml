name: Assignment3 Temp Run
on:
  push:
    branches:
      - chatgpt-assignment3-cifar-temp
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib scikit-learn nbformat nbconvert jupyter
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Reconstruct notebook generator
        run: |
          cat a3part_00 a3part_01 a3part_02 a3part_03 a3part_04 a3part_05 a3part_06 a3part_07 a3part_08 | base64 -d > assignment3_workflow.py
          python -m py_compile assignment3_workflow.py
      - name: Build and execute notebook
        run: |
          python assignment3_workflow.py
          jupyter nbconvert --to notebook --execute assignment3.ipynb --output Assignment3_Neural_Networks.ipynb --ExecutePreprocessor.timeout=-1
      - name: Validate execution
        run: |
          python - <<'PY'
          import nbformat
          p='Assignment3_Neural_Networks.ipynb'
          nb=nbformat.read(p,as_version=4)
          code_cells=[c for c in nb.cells if c.cell_type=='code']
          assert code_cells, 'No code cells'
          assert all(isinstance(c.execution_count,int) for c in code_cells), 'Unexecuted code cell'
          errors=[o for c in code_cells for o in c.get('outputs',[]) if o.get('output_type')=='error']
          assert not errors, errors
          text='\n'.join(
              o.get('text','') for c in code_cells for o in c.get('outputs',[])
              if o.get('output_type')=='stream'
          )
          assert 'Epoch 10/10' in text, 'CNN did not complete 10 epochs'
          assert 'Final test accuracy:' in text
          assert 'Test accuracy :' in text
          images=sum(
              1 for c in code_cells for o in c.get('outputs',[])
              if o.get('output_type') in ('display_data','execute_result') and 'image/png' in o.get('data',{})
          )
          assert images >= 4, f'Expected >=4 image outputs, got {images}'
          print(f'Validated {len(code_cells)} code cells, 0 errors, {images} image outputs.')
          PY
      - name: Export HTML
        run: |
          jupyter nbconvert --to html Assignment3_Neural_Networks.ipynb --output Assignment3_Neural_Networks.html
          ls -lh Assignment3_Neural_Networks.ipynb Assignment3_Neural_Networks.html
      - uses: actions/upload-artifact@v4
        with:
          name: assignment3-final
          path: |
            Assignment3_Neural_Networks.ipynb
            Assignment3_Neural_Networks.html
          retention-days: 1
