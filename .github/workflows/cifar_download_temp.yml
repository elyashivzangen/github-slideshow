name: CIFAR Download Temp
on:
  push:
    branches:
      - chatgpt-cifar-download-temp
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download CIFAR-10
        run: |
          curl -L --fail --retry 2 --connect-timeout 15 --max-time 180 -o cifar-10-python.tar.gz https://data.brainchip.com/dataset-mirror/cifar10/cifar-10-python.tar.gz ||           curl -L --fail --retry 2 --connect-timeout 15 --max-time 300 -o cifar-10-python.tar.gz https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz
          test -s cifar-10-python.tar.gz
          ls -lh cifar-10-python.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cifar10-raw
          path: cifar-10-python.tar.gz
          retention-days: 1
